<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sky" x1="24" y1="3" x2="24" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11052b"/>
      <stop offset="0.58" stop-color="#2c0d59"/>
      <stop offset="1" stop-color="#160736"/>
    </linearGradient>
    <linearGradient id="ring" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.52" stop-color="#ff2a9d"/>
      <stop offset="1" stop-color="#9b5de5"/>
    </linearGradient>
    <linearGradient id="sun" x1="24" y1="10" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.45" stop-color="#ff7b54"/>
      <stop offset="1" stop-color="#ff2a9d"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="24" cy="24" r="20.2"/>
    </clipPath>
  </defs>

  <!-- Night-sky badge fill -->
  <circle cx="24" cy="24" r="21" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <!-- Distant neon stars -->
    <circle cx="11.5" cy="12" r="0.9" fill="#00f5ff"/>
    <circle cx="36.5" cy="11" r="1" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="39" cy="17" r="0.7" fill="#ff79c6"/>
    <circle cx="9.5" cy="18.5" r="0.7" fill="#ffe066"/>

    <!-- Sliced neon horizon sun -->
    <circle cx="24" cy="21" r="10.5" fill="url(#sun)"/>
    <rect x="12" y="21.6" width="24" height="1.2" fill="#250b4d"/>
    <rect x="12" y="24.2" width="24" height="1.5" fill="#210945"/>
    <rect x="12" y="27" width="24" height="1.8" fill="#1b083b"/>

    <!-- Cyber city skyline -->
    <path d="M3 31V24h4v-3h3v4h2.5v-8.5h1.5V14h1v2.5h1.5V25h3v-4.5h4.5V26h2.5v-6.5h3V17h1v2.5h2V25h3v-3.5h4V31Z" fill="#13062e"/>
    <!-- Rim highlights on skyline -->
    <path d="M12.5 25v-8.5h4V25M26.5 26v-6.5h5.5V25" stroke="#00f5ff" stroke-opacity="0.65" stroke-width="0.7"/>
    <!-- Glowing tower windows -->
    <rect x="13.8" y="18.5" width="1.6" height="1" fill="#00f5ff"/>
    <rect x="13.8" y="20.8" width="1.6" height="1" fill="#ff6bd6"/>
    <rect x="13.8" y="23.1" width="1.6" height="1" fill="#00f5ff"/>
    <rect x="20.8" y="22.4" width="2.2" height="1" fill="#ffe066"/>
    <rect x="27.8" y="21.4" width="1.6" height="1" fill="#ff2a9d"/>
    <rect x="29.9" y="21.4" width="1.1" height="1" fill="#00f5ff"/>
    <rect x="27.8" y="23.6" width="2.6" height="1" fill="#00f5ff"/>
    <rect x="36.2" y="23.4" width="1.8" height="1" fill="#ff6bd6"/>

    <!-- Neon grid floor -->
    <rect x="3" y="30.5" width="42" height="15" fill="#12052b"/>
    <line x1="3" y1="30.8" x2="45" y2="30.8" stroke="#ff2a9d" stroke-width="1.3"/>
    <g stroke="#00f5ff" stroke-opacity="0.75" stroke-width="0.85">
      <line x1="4" y1="34.2" x2="44" y2="34.2"/>
      <line x1="5" y1="38.2" x2="43" y2="38.2"/>
      <line x1="8" y1="42.4" x2="40" y2="42.4"/>
      <line x1="24" y1="31" x2="24" y2="45"/>
      <line x1="19" y1="31" x2="12" y2="45"/>
      <line x1="29" y1="31" x2="36" y2="45"/>
      <line x1="14" y1="31" x2="3" y2="40"/>
      <line x1="34" y1="31" x2="45" y2="40"/>
    </g>
  </g>

  <!-- Outer neon gradient ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#ring)" stroke-width="1.9"/>
</svg>
