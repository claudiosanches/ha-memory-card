<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144" shape-rendering="crispEdges">
  <!-- Classic 1997 GeoCities sparse neon pixel starfield -->
  <rect x="14" y="18" width="2" height="2" fill="#00ffff" opacity="0.55"/>
  <rect x="62" y="10" width="2" height="2" fill="#ffff00" opacity="0.5"/>
  <rect x="116" y="28" width="2" height="2" fill="#ff00ff" opacity="0.55"/>
  <rect x="36" y="54" width="2" height="2" fill="#00ff66" opacity="0.55"/>
  <rect x="92" y="68" width="2" height="2" fill="#ffffff" opacity="0.45"/>
  <rect x="132" y="84" width="2" height="2" fill="#00ffff" opacity="0.5"/>
  <rect x="18" y="108" width="2" height="2" fill="#ff00ff" opacity="0.5"/>
  <rect x="74" y="118" width="2" height="2" fill="#00ff66" opacity="0.5"/>
  <rect x="118" y="132" width="2" height="2" fill="#ffff00" opacity="0.5"/>
  <!-- Tiny 90s pixel plus-star -->
  <g fill="#00ffff" opacity="0.4">
    <rect x="48" y="90" width="2" height="6"/>
    <rect x="46" y="92" width="6" height="2"/>
  </g>
</svg>
