configuration:
  managers:
    name: Gestores
    description: >-
      IDs de usuario de Home Assistant que pueden cambiar la colección. Los
      demás solo pueden explorarla, y mientras esto esté vacío nadie puede
      cambiarla. Cada usuario encuentra su ID en Ajustes de Memory Card.
  viewers_track_progress:
    name: Los lectores registran su progreso
    description: >-
      Permitir que los usuarios que no son gestores lleven su propio registro
      de juego: su estado de cada juego, sus sesiones y sus sorteos. Todo lo
      demás sigue siendo de solo lectura para ellos.
  external_services:
    name: Usar servicios externos
    description: >-
      Buscar juegos, portadas y plataformas en IGDB, y códigos de barras en
      UPCitemdb. Desactívalo para que Memory Card no se conecte a internet;
      las credenciales de IGDB de abajo se ignoran y los juegos se introducen a mano.
  igdb_client_id:
    name: ID de cliente de IGDB
    description: >-
      Da acceso a IGDB a través de una aplicación de desarrollador de Twitch.
      Para crearla, activa la autenticación en dos pasos en Twitch, abre
      dev.twitch.tv/console/apps y registra una aplicación con la URL de
      redirección OAuth http://localhost, la categoría Application Integration
      y el tipo de cliente Confidential. Luego ábrela con Manage y copia aquí
      su Client ID. Déjalo vacío para usar la aplicación sin la información y
      las portadas de IGDB.
  igdb_client_secret:
    name: Secreto de cliente de IGDB
    description: >-
      En la misma aplicación de Twitch, pulsa New Secret y pega aquí el Client
      Secret. Guarda y reinicia la aplicación.
  sensors:
    name: Sensores de Home Assistant
    description: >-
      Publicar los recuentos del hogar, el backlog y las partidas de cada
      persona y el último sorteo como sensores de Home Assistant. "mqtt" los
      publica a través de la aplicación Mosquitto broker y la integración
      MQTT; "integration", a través de la integración Memory Card del
      Marketplace, sin broker y con un botón que sortea un juego; "off" los
      elimina.
  tag_scan_finished:
    name: Etiqueta leída en un juego terminado
    description: >-
      Qué hace la lectura de la etiqueta NFC de una copia cuando tu estado del
      juego es completado, abandonado o al 100%. "playing" lo vuelve a poner
      en jugando; "keep" lo conserva y solo registra la sesión.
  tag_readers:
    name: Lectores NFC
    description: >-
      Lectores sin usuario de Home Assistant, como los de ESPHome, y para
      quién registran sus lecturas: el ID de dispositivo del lector y el ID de
      usuario de la persona. Una lectura de un lector que no está en la lista
      no registra nada.
  currency:
    name: Moneda predeterminada
    description: >-
      Código de tres letras, como EUR o MXN, con el que empiezan los precios
      nuevos. Vacío usa la moneda de la última copia con precio y después la
      de Home Assistant.
  date_format:
    name: Formato de fecha
    description: >-
      Cómo se escriben las fechas. "language" sigue el idioma de la
      aplicación; "dmy" escribe 23/11/2026, "mdy" 11/23/2026 e "ymd"
      2026-11-23.
  show_slugs:
    name: Mostrar campos de slug
    description: >-
      Mostrar y editar el campo slug en los formularios de cuentas, tiendas,
      plataformas, categorías y hardware. Los slugs se generan igual a partir
      del nombre y se usan en los filtros de sorteo de Home Assistant y en
      los enlaces de la biblioteca.
  log_level:
    name: Nivel de registro
    description: Cuánto escribe la aplicación en su registro.
