configuration:
  managers:
    name: Managers
    description: >-
      Home Assistant user IDs that can change the collection. Everyone else
      can only browse it, and while this is empty nobody can change it. Each
      user finds their ID under Settings in Memory Card.
  viewers_track_progress:
    name: Viewers track play progress
    description: >-
      Let users who are not managers change play status and log play sessions.
      Everything else stays read only for them.
  external_services:
    name: Use external services
    description: >-
      Look up games, covers and platforms on IGDB, and barcodes on
      UPCitemdb. Turn off to keep Memory Card from contacting the internet;
      the IGDB credentials below are then ignored and games are entered by hand.
  igdb_client_id:
    name: IGDB client ID
    description: >-
      Client ID of your Twitch developer application. Leave empty to use the
      app without IGDB metadata and covers.
  igdb_client_secret:
    name: IGDB client secret
    description: Client secret of the same Twitch application.
  sensors:
    name: Home Assistant sensors
    description: >-
      Publish collection counts, what you are playing and what you added last
      as Home Assistant sensors, with a button that picks a random game. "mqtt"
      publishes them through the Mosquitto broker app and the MQTT
      integration; "off" removes them.
  tag_scan_finished:
    name: Tag scan on a finished game
    description: >-
      What scanning a copy's NFC tag does when its game is completed, dropped
      or mastered. "playing" sets the game back to playing; "keep" keeps its
      status and only logs the session.
  currency:
    name: Default currency
    description: >-
      Three-letter code, such as EUR or BRL, that new prices start with.
      Empty uses the currency of the copy priced last, then Home Assistant's
      currency.
  log_level:
    name: Log level
    description: How much the app writes to its log.
