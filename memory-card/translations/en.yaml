configuration:
  igdb_client_id:
    name: IGDB client ID
    description: >-
      Client ID of your Twitch developer application. Leave empty to use the
      app without IGDB metadata and covers.
  igdb_client_secret:
    name: IGDB client secret
    description: Client secret of the same Twitch application.
  log_level:
    name: Log level
    description: How much the app writes to its log.
  managers:
    name: Managers
    description: >-
      Home Assistant user IDs that can change the collection. Everyone else
      can only browse it, and while this is empty nobody can change it. Each
      user finds their ID under Settings in Memory Card.
  external_services:
    name: Use external services
    description: >-
      Look up games, covers and platforms on IGDB. Turn off to keep Memory
      Card from contacting the internet; the IGDB credentials are then
      ignored and games are entered by hand.
  viewers_track_progress:
    name: Viewers track play progress
    description: >-
      Let users who are not managers change play status and last played.
      Everything else stays read only for them.
