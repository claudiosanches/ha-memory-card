configuration:
  managers:
    name: Gestores
    description: >-
      IDs de usuário do Home Assistant que podem alterar a coleção. Os demais
      só podem navegar por ela, e enquanto isto estiver vazio ninguém pode
      alterá-la. Cada usuário encontra o próprio ID nas Configurações do
      Memory Card.
  viewers_track_progress:
    name: Visualizadores registram progresso
    description: >-
      Permitir que usuários que não são gestores mudem o status de jogo e
      registrem sessões. O resto continua somente leitura para eles.
  external_services:
    name: Usar serviços externos
    description: >-
      Buscar jogos, capas e plataformas no IGDB, e códigos de barras no
      UPCitemdb. Desligue para impedir que o Memory Card acesse a internet;
      as credenciais do IGDB abaixo são ignoradas e os jogos são informados à mão.
  igdb_client_id:
    name: ID do cliente IGDB
    description: >-
      Dá acesso ao IGDB por meio de um aplicativo de desenvolvedor da Twitch.
      Para criar um, ative a autenticação em dois fatores na Twitch, abra
      dev.twitch.tv/console/apps e registre um aplicativo com a URL de
      redirecionamento OAuth http://localhost, a categoria Application
      Integration e o tipo de cliente Confidential. Depois abra-o em Manage e
      copie aqui o Client ID. Deixe vazio para usar o aplicativo sem
      informações e capas do IGDB.
  igdb_client_secret:
    name: Segredo do cliente IGDB
    description: >-
      No mesmo aplicativo da Twitch, clique em New Secret e cole aqui o Client
      Secret. Salve e reinicie o aplicativo.
  sensors:
    name: Sensores do Home Assistant
    description: >-
      Publicar contagens da coleção, o que você está jogando e o que adicionou
      por último como sensores do Home Assistant, com um botão que sorteia um
      jogo. "mqtt" publica tudo isso pelo aplicativo Mosquitto broker e pela
      integração MQTT; "integration", pela integração Memory Card do
      Marketplace ou do HACS, sem broker; "off" remove tudo isso.
  tag_scan_finished:
    name: Tag lida em um jogo terminado
    description: >-
      O que a leitura da tag NFC de uma cópia faz quando o jogo está zerado,
      abandonado ou em 100%. "playing" volta o jogo para jogando; "keep"
      mantém o status e só registra a sessão.
  currency:
    name: Moeda padrão
    description: >-
      Código de três letras, como BRL ou EUR, com que os preços novos
      começam. Vazio usa a moeda da última cópia com preço e depois a do
      Home Assistant.
  date_format:
    name: Formato de data
    description: >-
      Como as datas são escritas. "language" segue o idioma do aplicativo;
      "dmy" escreve 23/11/2026, "mdy" 11/23/2026 e "ymd" 2026-11-23.
  log_level:
    name: Nível de log
    description: Quanto o aplicativo escreve no log.
