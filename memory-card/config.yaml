name: Memory Card
version: "0.1.0"
slug: memory_card
description: Track your video game collection across consoles
url: https://github.com/claudiosanches/ha-memory-card
arch:
  - aarch64
  - amd64
image: ghcr.io/claudiosanches/memory-card
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:gamepad-variant
panel_title: Memory Card
panel_admin: false
backup: cold
timeout: 20
# Hears tag scans for linked copies.
homeassistant_api: true
services:
  - mqtt:want
options:
  igdb_client_id: ""
  igdb_client_secret: ""
  log_level: info
  managers: []
  viewers_track_progress: false
  external_services: true
  sensors: true
  tag_scan_finished: playing
schema:
  igdb_client_id: "str?"
  igdb_client_secret: "password?"
  log_level: "list(trace|debug|info|warning|error)"
  managers:
    - str
  viewers_track_progress: bool
  external_services: bool
  sensors: bool
  tag_scan_finished: "list(playing|keep)"
  currency: "match(^[A-Za-z]{3}$)?"
