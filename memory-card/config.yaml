name: Memory Card
version: "0.1.1"
slug: memory_card
description: Track your video game collection across consoles
url: https://github.com/claudiosanches/ha-memory-card
homeassistant: "2026.11.0"
arch:
  - aarch64
  - amd64
image: ghcr.io/claudiosanches/memory-card
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:gamepad-variant
panel_title: Memory Card
panel_admin: false
backup: cold
timeout: 20
# Hears tag scans for linked copies.
homeassistant_api: true
services:
  - mqtt:want
# Points the Memory Card integration at the sensors feed.
discovery:
  - memory_card
options:
  managers: []
  viewers_track_progress: false
  external_services: true
  igdb_client_id: ""
  igdb_client_secret: ""
  sensors: "off"
  tag_scan_finished: playing
  tag_readers: []
  date_format: language
  log_level: info
schema:
  managers:
    - str
  viewers_track_progress: bool
  external_services: bool
  igdb_client_id: "str?"
  igdb_client_secret: "password?"
  sensors: "list(mqtt|integration|off)"
  tag_scan_finished: "list(playing|keep)"
  tag_readers:
    - device: str
      person: str
  currency: "match(^[A-Za-z]{3}$)?"
  date_format: "list(language|dmy|mdy|ymd)"
  log_level: "list(trace|debug|info|warning|error)"
