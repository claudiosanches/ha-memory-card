version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint and openapi-typescript call TypeScript's compiler API,
      # which TypeScript 7 does not export.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /docs
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /memory-card
    target-branch: dev
    schedule:
      interval: weekly
