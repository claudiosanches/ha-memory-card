name: Image

# Both architectures, built and smoke-tested without pushing. A release builds
# its own. Pull requests build only when they change what goes into the image.
on:
  pull_request:
    paths:
      - memory-card/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/build-binaries.sh
      - scripts/smoke-archive.sh
      - .github/workflows/image.yml
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.15.2

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild@0.24.1
      - run: npm ci
      - run: npm run build
      - run: ./scripts/build-binaries.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The emulators by digest, since the action runs them privileged.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder by digest; Dependabot does not update it.
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Build both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: memory-card/Dockerfile
          platforms: linux/amd64,linux/arm64
          # gzip throughout, base layers included: skopeo on the runner annotates zstd
          # images in the index, which --preserve-digests then refuses to push.
          outputs: type=oci,dest=${{ runner.temp }}/memory-card.tar,compression=gzip,force-compression=true
      - run: ./scripts/smoke-archive.sh "$RUNNER_TEMP/memory-card.tar"
