name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.15.2
  IMAGE: ghcr.io/claudiosanches/memory-card

jobs:
  # Runs the dependencies and build tools, without the token that can push.
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version matches the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          ./scripts/check-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@0.24.1
      - run: npm ci
      - run: npm run build
      - run: ./scripts/build-binaries.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The emulators by digest, since the action runs them privileged.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder by digest; Dependabot does not update it.
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Build both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: memory-card/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/memory-card.tar
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: memory-card/Dockerfile
          platforms: linux/amd64
          load: true
          tags: memory-card:release
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
      - run: ./scripts/smoke-image.sh memory-card:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/memory-card.tar
          if-no-files-found: error
          retention-days: 1

  # Pushes the image the build job tested, and runs nothing from the repository.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Push both architectures
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          skopeo copy --all --preserve-digests \
            "oci-archive:$RUNNER_TEMP/memory-card.tar" "docker://$IMAGE:$VERSION"
